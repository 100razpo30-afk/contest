apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: contest
  namespace: contest
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    cert-manager.io/cluster-issuer: local-ca-issuer

spec:
  tls:
  - hosts:
    - contest.local.lan
    secretName: contest-tls-secret
  ingressClassName: nginx
  rules:
  - host: contest.local.lan
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: frontend
            port: 
              number: 80
