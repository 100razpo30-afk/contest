apiVersion: apps/v1
kind: Deployment
metadata:
  name: contest-front
  namespace: contest
  labels:
    app.kubernetes.io/name: &name contest-front
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: *name
  template:
    metadata:
      labels:
        app.kubernetes.io/name: *name
    spec:
      containers:
      - name: front
        image: ghcr.io/100razpo30-afk/contest/contest-front:bbd5aa0679626e1e36255f42bd99945b86799bf0
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        ports:
        - containerPort: 80
      imagePullSecrets:
      - name: ghcr-secret

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: contest
spec:
  selector:
    app.kubernetes.io/name: contest-front
  ports:
  - port: 80
    targetPort: 80

