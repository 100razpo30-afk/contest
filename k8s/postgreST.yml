apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: contest
  labels:
    app.kubernetes.io/name: &name postgres
    app.kubernetes.io/version: &version "17-alpine"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: *name
      app.kubernetes.io/version: *version
  serviceName: postgres
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: *name
        app.kubernetes.io/version: *version
    spec:
      nodeSelector:
        kubernetes.io/hostname: "w1.local.lan" # создать метку
      containers:
      - name: postgres
        image: docker.io/library/postgres:17-alpine
        ports:
        - containerPort: 5432
        env:
          - name: POSTGRES_DB
            valueFrom:
              configMapKeyRef:
                name: contest-config
                key: DB_NAME
          - name: POSTGRES_USER
            valueFrom:
              configMapKeyRef:
                name: contest-config
                key: DB_USER
          - name: POSTGRES_HOST
            valueFrom:
              configMapKeyRef:
                name: contest-config
                key: DB_HOST
          - name: POSTGRES_PORT
            valueFrom:
              configMapKeyRef:
                name: contest-config
                key: DB_PORT
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgre-secret
                key: DB_PASSWORD
          - name: PGDATA
            value: /var/lib/postgresql/data/pgdata


        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        readinessProbe:
            exec:
              command: ["pg_isready", "-U", "admin"]
            initialDelaySeconds: 5
            periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgre-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: contest
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/version: "17-alpine"
spec:
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/version: "17-alpine"
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None
