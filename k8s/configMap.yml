apiVersion: v1
kind: ConfigMap
metadata:
  name: contest-config
  namespace: contest
  labels:
    app.kubernetes.io/name: contestConfig
data:
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_USER: "admin"
  DB_NAME: "contest"
  KEYCLOAK_URL: "http://keycloak.kontent.svc.cluster.local:8080"
  KEYCLOAK_REALM: "kontent"
  KEYCLOAK_CLIENT_ID: "contest"

