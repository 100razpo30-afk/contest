apiVersion: v1
kind: Namespace
metadata:
  name: gateway-system
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: local-apps-tls
  namespace: gateway-system
spec:
  secretName: local-apps-tls
  duration: 8760h
  renewBefore: 720h
  dnsNames:
    - "*.local.lan"
  issuerRef:
    name: local-ca-issuer
    kind: ClusterIssuer
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: local-gateway-proxy
  namespace: gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: local-gateway
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: local-gateway
  namespace: gateway-system
spec:
  gatewayClassName: local-gateway
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: local-gateway-proxy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: local-apps-tls
      allowedRoutes:
        namespaces:
          from: All
    # Temporary compatibility listener for applications built with :30443.
    # Remove it after all frontends and Keycloak use standard HTTPS on 443.
    - name: legacy-https
      protocol: HTTPS
      port: 30443
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: local-apps-tls
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirect-http-to-https
  namespace: gateway-system
spec:
  parentRefs:
    - name: local-gateway
      sectionName: http
  hostnames:
    - contest.local.lan
    - kontent.local.lan
    - keycloak.local.lan
    - minio.local.lan
    - minio-console.local.lan
    - grafana.local.lan
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 308
