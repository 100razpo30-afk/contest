apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: contest
  namespace: contest
spec:
  parentRefs:
    - name: local-gateway
      namespace: gateway-system
      sectionName: https
    - name: local-gateway
      namespace: gateway-system
      sectionName: legacy-https
  hostnames:
    - contest.local.lan
  rules:
    - backendRefs:
        - name: frontend
          port: 80
