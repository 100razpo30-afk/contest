apiVersion: v1
kind: PersistentVolume
metadata:
  name: contest-pg-pv
  labels:
    app.kubernetes.io/name: contest-pg-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  iscsi:
    targetPortal: "192.168.1.131:3260"
    iqn: "iqn.2026-10.com.terramaster:postgre"
    lun: 0
    fsType: ext4

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgre-data
  namespace: contest
  labels:
    app.kubernetes.io/name: postgre-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
  volumeName: contest-pg-pv

